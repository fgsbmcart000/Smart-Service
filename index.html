<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>佛光山佛陀紀念館 智慧服務台</title>
    <meta
      name="description"
      content="佛光山佛陀紀念館智慧服務台平板入口首頁，提供輪播導覽與快速連結。"
    />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23863b26'/%3E%3Cpath d='M16 42h32l-5 10H21z' fill='%23f8d486'/%3E%3Cpath d='M24 26h16l4 16H20z' fill='%23fff3d0'/%3E%3Cpath d='M29 15h6l8 11H21z' fill='%23f8d486'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ink: #2b1d18;
        --muted: #75584b;
        --line: rgba(116, 58, 32, 0.18);
        --paper: #fff9ef;
        --brand: #823925;
        --brand-dark: #5e291d;
        --gold: #d9a958;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family:
          "Noto Sans TC",
          "PingFang TC",
          "Microsoft JhengHei",
          system-ui,
          sans-serif;
        overflow: hidden;
      }

      .kiosk {
        min-height: 100vh;
        min-height: 100svh;
        height: 100vh;
        height: 100svh;
        display: grid;
        grid-template-rows: 1fr;
      }

      header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 22px;
        min-height: 76px;
        padding: 14px clamp(22px, 4vw, 64px);
        color: #fffaf0;
        background: transparent;
        pointer-events: none;
      }

      .brand {
        display: flex;
        align-items: center;
        min-width: 192px;
      }

      .brand-logo {
        display: block;
        width: clamp(192px, 16vw, 240px);
        height: auto;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.85));
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      nav {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 14px;
        flex-wrap: wrap;
        pointer-events: auto;
      }

      nav a {
        min-height: 54px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        border: 1px solid rgba(247, 211, 144, 0.7);
        border-radius: 999px;
        color: #fff7e8;
        background: rgba(20, 26, 29, 0.42);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        text-decoration: none;
        font-size: clamp(16px, 1.2vw, 19px);
        font-weight: 700;
        white-space: nowrap;
        box-shadow: 0 0 0 1px rgba(255, 238, 189, 0.08) inset, 0 0 18px rgba(221, 172, 89, 0.2);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
        transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      nav a:focus-visible,
      .slide-link:focus-visible,
      .dot:focus-visible {
        outline: 4px solid rgba(217, 169, 88, 0.55);
        outline-offset: 4px;
      }

      nav a:hover {
        transform: translateY(-2px);
        background: linear-gradient(180deg, rgba(242, 202, 126, 0.38), rgba(193, 139, 66, 0.2));
        box-shadow: 0 0 24px rgba(236, 185, 96, 0.45);
      }

      nav button {
        min-height: 54px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 26px;
        border: 1px solid rgba(255, 230, 173, 0.9);
        border-radius: 999px;
        color: #2e2113;
        background: linear-gradient(180deg, #ffe8b1, #dca957);
        font: inherit;
        font-size: clamp(16px, 1.2vw, 19px);
        font-weight: 800;
        white-space: nowrap;
        cursor: pointer;
        box-shadow: 0 0 26px rgba(235, 184, 94, 0.55);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      nav button:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 0 34px rgba(255, 205, 113, 0.72);
      }

      nav button:focus-visible,
      .activity-close:focus-visible {
        outline: 4px solid rgba(255, 232, 177, 0.75);
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        nav a,
        nav button,
        .activity-panel { transition: none; }
      }

      main {
        position: relative;
        min-height: 0;
        height: 100%;
      }

      .home-stage {
        display: grid;
        place-items: center;
        padding: 116px 28px 36px;
        color: #fff7e8;
        text-align: center;
        background:
          radial-gradient(circle at 50% 38%, rgba(213, 164, 79, 0.3), transparent 32%),
          linear-gradient(145deg, #392417 0%, #151d25 55%, #0c1218 100%);
      }

      .home-title {
        margin: 0;
        font-size: clamp(34px, 5vw, 74px);
        line-height: 1.15;
        letter-spacing: 0.08em;
        text-shadow: 0 8px 30px rgba(0, 0, 0, 0.42);
      }

      .home-title span {
        display: block;
        margin-top: 16px;
        color: #e2bd78;
        font-size: 0.42em;
        font-weight: 500;
        letter-spacing: 0.32em;
      }

      .activity-panel {
        position: fixed;
        inset: 0;
        z-index: 20;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        background: #17130f;
        transition: opacity 240ms ease, visibility 240ms ease;
      }

      .activity-panel.open {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
      }

      .activity-close {
        position: absolute;
        top: 18px;
        right: 22px;
        z-index: 30;
        min-width: 52px;
        min-height: 52px;
        padding: 0 18px;
        border: 1px solid rgba(255, 244, 220, 0.72);
        border-radius: 999px;
        color: #fffaf0;
        background: rgba(17, 18, 20, 0.58);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 0 18px rgba(0, 0, 0, 0.3);
      }

      .carousel {
        position: relative;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        background: #17130f;
      }

      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform: scale(1.02);
        transition:
          opacity 900ms ease,
          transform 1200ms ease;
        pointer-events: none;
      }

      .slide.active {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }

      .slide-link {
        position: absolute;
        inset: 0;
        display: block;
        color: inherit;
        text-decoration: none;
        overflow: hidden;
        background-color: #17130f;
        background-position: top center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .slide img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
        z-index: 1;
      }

      .shade {
        position: absolute;
        inset: 0;
        z-index: 2;
        background:
          linear-gradient(90deg, rgba(35, 22, 16, 0.76), rgba(35, 22, 16, 0.18) 55%, rgba(35, 22, 16, 0.04)),
          linear-gradient(0deg, rgba(35, 22, 16, 0.44), transparent 45%);
      }

      .slide-copy {
        position: absolute;
        left: clamp(32px, 6vw, 92px);
        bottom: clamp(88px, 11vw, 128px);
        width: min(760px, 70vw);
        color: #fffaf0;
        z-index: 3;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 0 16px;
        border-radius: 999px;
        background: rgba(255, 246, 224, 0.18);
        border: 1px solid rgba(255, 246, 224, 0.32);
        font-size: clamp(15px, 1.4vw, 19px);
        font-weight: 700;
      }

      .slide-copy h2 {
        margin: 22px 0 14px;
        font-size: clamp(42px, 6vw, 84px);
        line-height: 1.05;
        font-weight: 900;
        letter-spacing: 0;
      }

      .slide-copy p {
        margin: 0;
        max-width: 620px;
        font-size: clamp(20px, 2.1vw, 30px);
        line-height: 1.45;
        font-weight: 500;
      }

      .cta {
        margin-top: 32px;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 62px;
        padding: 8px 30px 10px;
        border-radius: 999px;
        color: var(--brand-dark);
        background: #fff4dc;
        font-weight: 800;
        line-height: 1.12;
        box-shadow: 0 18px 42px rgba(41, 20, 12, 0.22);
      }

      .cta .zh {
        font-size: clamp(18px, 1.65vw, 23px);
      }

      .cta .en {
        margin-top: 3px;
        font-size: clamp(11px, 1vw, 14px);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.72;
      }

      .controls {
        position: absolute;
        z-index: 4;
        right: clamp(18px, 2.4vw, 38px);
        bottom: clamp(18px, 2.4vw, 34px);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 9px;
        border-radius: 999px;
        background: rgba(25, 13, 8, 0.08);
        opacity: 0.34;
        transition: opacity 180ms ease;
      }

      .controls:hover,
      .controls:focus-within {
        opacity: 0.78;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        border: 0;
        background: rgba(255, 250, 240, 0.5);
        cursor: pointer;
        padding: 0;
      }

      .dot.active {
        width: 18px;
        background: rgba(255, 250, 240, 0.92);
      }

      .progress {
        position: absolute;
        z-index: 4;
        left: 0;
        right: 0;
        bottom: 0;
        height: 6px;
        background: rgba(255, 255, 255, 0.24);
      }

      .progress span {
        display: block;
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #fff4dc, var(--gold));
      }

      .slide.active ~ .progress span {
        animation: none;
      }

      @media (max-width: 900px) {
        body {
          overflow: auto;
        }

        .kiosk {
          min-height: 100vh;
          grid-template-rows: 1fr;
        }

        header {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
          min-height: auto;
        }

        .brand {
          min-width: 0;
        }

        nav {
          width: 100%;
          justify-content: flex-start;
          flex-wrap: wrap;
          padding-bottom: 4px;
        }

        nav a,
        nav button {
          min-height: 48px;
          padding: 0 18px;
        }

        .activity-close {
          top: 12px;
          right: 12px;
        }

        .slide-copy {
          left: 26px;
          right: 26px;
          bottom: 100px;
          width: auto;
        }

        .slide-copy h2 {
          font-size: clamp(38px, 12vw, 64px);
        }

        .slide-copy p {
          font-size: 20px;
        }

        .controls {
          left: 20px;
          right: auto;
          bottom: 20px;
        }

        .carousel {
          height: 100%;
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="kiosk">
      <header>
        <div class="brand">
          <img class="brand-logo" src="assets/buddha-museum-logo.png" alt="佛光山佛陀紀念館 Fo Guang Shan Buddha Museum" width="192" height="38" />
          <h1 class="sr-only">佛光山佛陀紀念館 智慧服務台</h1>
        </div>
        <nav aria-label="主要選單">
          <a href="https://app.oratoflow.com/" target="_blank" rel="noopener noreferrer">智慧翻譯服務台</a>
          <a href="https://www.fgsbmc.org.tw/" target="_blank" rel="noopener noreferrer">佛館官網</a>
          <button id="activity-open" type="button" aria-haspopup="dialog" aria-controls="activity-panel">最新活動資訊</button>
        </nav>
      </header>

      <main class="home-stage">
        <h2 class="home-title">佛光山佛陀紀念館<span>智慧服務台</span></h2>
      </main>

      <section id="activity-panel" class="activity-panel" role="dialog" aria-modal="true" aria-label="最新活動資訊" aria-hidden="true">
        <button id="activity-close" class="activity-close" type="button">關閉</button>
        <section class="carousel" aria-label="最新活動輪播">
          <article class="slide active">
            <a class="slide-link" href="http://lnago.com/ADR1R" target="_blank" rel="noopener noreferrer" aria-label="前往童話劇《罐頭小人》">
              <img src="assets/banner-photo-1.jpg" alt="童話劇《罐頭小人》" />
            </a>
          </article>

          <article class="slide">
            <a class="slide-link" href="http://lnago.com/ADR1S" target="_blank" rel="noopener noreferrer" aria-label="前往為人間：遇見星雲大師">
              <img src="assets/banner-photo-2.jpg" alt="為人間：遇見星雲大師" />
            </a>
          </article>

          <article class="slide">
            <a class="slide-link" href="http://lnago.com/ADQ7R" target="_blank" rel="noopener noreferrer" aria-label="前往佛陀紀念館第18期徵才">
              <img src="assets/banner-photo-3.jpg" alt="佛陀紀念館第18期徵才" />
            </a>
          </article>

          <article class="slide">
            <a class="slide-link" href="http://lnago.com/ADR06" target="_blank" rel="noopener noreferrer" aria-label="前往人世間・迴響：南非天龍隊表演">
              <img src="assets/banner-photo-4.jpg" alt="人世間・迴響：南非天龍隊表演" />
            </a>
          </article>

          <article class="slide">
            <a class="slide-link" href="https://www.fgsbmc.org.tw/tw/exhibition.aspx?serno=189" target="_blank" rel="noopener noreferrer" aria-label="前往菩提心起：國立歷史博物館典藏佛像特展">
              <img src="assets/banner-photo-5.jpg" alt="菩提心起：國立歷史博物館典藏佛像特展" />
            </a>
          </article>

          <div class="controls" aria-label="輪播控制">
            <button class="dot active" type="button" aria-label="顯示第 1 張"></button>
            <button class="dot" type="button" aria-label="顯示第 2 張"></button>
            <button class="dot" type="button" aria-label="顯示第 3 張"></button>
            <button class="dot" type="button" aria-label="顯示第 4 張"></button>
            <button class="dot" type="button" aria-label="顯示第 5 張"></button>
          </div>
          <div class="progress" aria-hidden="true"><span></span></div>
        </section>
      </section>
    </div>

    <script>
      const slides = Array.from(document.querySelectorAll(".slide"));
      const dots = Array.from(document.querySelectorAll(".dot"));
      const progress = document.querySelector(".progress span");
      const activityPanel = document.querySelector("#activity-panel");
      const activityOpen = document.querySelector("#activity-open");
      const activityClose = document.querySelector("#activity-close");
      const intervalMs = 12000;
      let current = 0;
      let timer;

      function restartProgress() {
        progress.style.animation = "none";
        progress.offsetHeight;
        progress.style.animation = `fill ${intervalMs}ms linear forwards`;
      }

      function showSlide(index) {
        current = (index + slides.length) % slides.length;
        slides.forEach((slide, slideIndex) => {
          slide.classList.toggle("active", slideIndex === current);
        });
        dots.forEach((dot, dotIndex) => {
          dot.classList.toggle("active", dotIndex === current);
        });
        restartProgress();
      }

      function startTimer() {
        window.clearInterval(timer);
        timer = window.setInterval(() => showSlide(current + 1), intervalMs);
      }

      function openActivities() {
        activityPanel.classList.add("open");
        activityPanel.setAttribute("aria-hidden", "false");
        showSlide(current);
        startTimer();
        activityClose.focus();
      }

      function closeActivities() {
        activityPanel.classList.remove("open");
        activityPanel.setAttribute("aria-hidden", "true");
        window.clearInterval(timer);
        activityOpen.focus();
      }

      activityOpen.addEventListener("click", openActivities);
      activityClose.addEventListener("click", closeActivities);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && activityPanel.classList.contains("open")) {
          closeActivities();
        }
      });

      dots.forEach((dot, index) => {
        dot.addEventListener("click", () => {
          showSlide(index);
          startTimer();
        });
      });

      let touchStartX = 0;
      document.querySelector(".carousel").addEventListener("touchstart", (event) => {
        touchStartX = event.changedTouches[0].clientX;
      });
      document.querySelector(".carousel").addEventListener("touchend", (event) => {
        const delta = event.changedTouches[0].clientX - touchStartX;
        if (Math.abs(delta) > 60) {
          showSlide(current + (delta < 0 ? 1 : -1));
          startTimer();
        }
      });

      const style = document.createElement("style");
      style.textContent = `@keyframes fill { from { width: 0; } to { width: 100%; } }`;
      document.head.appendChild(style);
    </script>
  </body>
</html>
