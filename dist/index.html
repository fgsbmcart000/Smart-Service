<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>佛光山佛陀紀念館 智慧服務台</title>
    <meta
      name="description"
      content="佛光山佛陀紀念館智慧服務台平板入口首頁，提供輪播導覽與快速連結。"
    />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23863b26'/%3E%3Cpath d='M16 42h32l-5 10H21z' fill='%23f8d486'/%3E%3Cpath d='M24 26h16l4 16H20z' fill='%23fff3d0'/%3E%3Cpath d='M29 15h6l8 11H21z' fill='%23f8d486'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ink: #2b1d18;
        --muted: #75584b;
        --line: rgba(116, 58, 32, 0.18);
        --paper: #fff9ef;
        --brand: #823925;
        --brand-dark: #5e291d;
        --gold: #d9a958;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family:
          "Noto Sans TC",
          "PingFang TC",
          "Microsoft JhengHei",
          system-ui,
          sans-serif;
        overflow: hidden;
      }

      .kiosk {
        min-height: 100vh;
        min-height: 100svh;
        height: 100vh;
        height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        position: relative;
        top: 0;
        left: 0;
        right: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 22px;
        min-height: 76px;
        padding: 14px clamp(22px, 4vw, 64px);
        color: #fffaf0;
        background: #5e291d;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 320px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        color: #fff3d0;
        background: rgba(255, 250, 240, 0.16);
        border: 1px solid rgba(255, 250, 240, 0.26);
        font-size: 22px;
        font-weight: 800;
      }

      .brand-title {
        margin: 0;
        font-size: clamp(19px, 1.8vw, 27px);
        line-height: 1.15;
        font-weight: 600;
        letter-spacing: 0;
        text-shadow: 0 2px 12px rgba(25, 13, 8, 0.42);
      }

      .brand-subtitle {
        display: block;
        margin-top: 4px;
        color: rgba(255, 250, 240, 0.78);
        font-size: clamp(13px, 1.1vw, 16px);
        font-weight: 400;
      }

      nav {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
        flex-wrap: wrap;
      }

      nav a {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 999px;
        color: rgba(255, 250, 240, 0.9);
        text-decoration: none;
        font-size: clamp(14px, 1.12vw, 17px);
        font-weight: 400;
        white-space: nowrap;
        text-shadow: 0 2px 10px rgba(25, 13, 8, 0.38);
      }

      nav a:focus-visible,
      .slide-link:focus-visible,
      .dot:focus-visible {
        outline: 4px solid rgba(217, 169, 88, 0.55);
        outline-offset: 4px;
      }

      nav a.active,
      nav a:hover {
        color: #fffaf0;
        background: rgba(255, 250, 240, 0.12);
        border-color: rgba(255, 250, 240, 0.18);
      }

      main {
        position: relative;
        min-height: 0;
        height: 100%;
      }

      .carousel {
        position: relative;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        background: #17130f;
      }

      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform: scale(1.02);
        transition:
          opacity 900ms ease,
          transform 1200ms ease;
        pointer-events: none;
      }

      .slide.active {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }

      .slide-link {
        position: absolute;
        inset: 0;
        display: block;
        color: inherit;
        text-decoration: none;
        overflow: hidden;
        background-color: #17130f;
        background-position: top center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .slide img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
        z-index: 1;
      }

      .shade {
        position: absolute;
        inset: 0;
        z-index: 2;
        background:
          linear-gradient(90deg, rgba(35, 22, 16, 0.76), rgba(35, 22, 16, 0.18) 55%, rgba(35, 22, 16, 0.04)),
          linear-gradient(0deg, rgba(35, 22, 16, 0.44), transparent 45%);
      }

      .slide-copy {
        position: absolute;
        left: clamp(32px, 6vw, 92px);
        bottom: clamp(88px, 11vw, 128px);
        width: min(760px, 70vw);
        color: #fffaf0;
        z-index: 3;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 0 16px;
        border-radius: 999px;
        background: rgba(255, 246, 224, 0.18);
        border: 1px solid rgba(255, 246, 224, 0.32);
        font-size: clamp(15px, 1.4vw, 19px);
        font-weight: 700;
      }

      .slide-copy h2 {
        margin: 22px 0 14px;
        font-size: clamp(42px, 6vw, 84px);
        line-height: 1.05;
        font-weight: 900;
        letter-spacing: 0;
      }

      .slide-copy p {
        margin: 0;
        max-width: 620px;
        font-size: clamp(20px, 2.1vw, 30px);
        line-height: 1.45;
        font-weight: 500;
      }

      .cta {
        margin-top: 32px;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 62px;
        padding: 8px 30px 10px;
        border-radius: 999px;
        color: var(--brand-dark);
        background: #fff4dc;
        font-weight: 800;
        line-height: 1.12;
        box-shadow: 0 18px 42px rgba(41, 20, 12, 0.22);
      }

      .cta .zh {
        font-size: clamp(18px, 1.65vw, 23px);
      }

      .cta .en {
        margin-top: 3px;
        font-size: clamp(11px, 1vw, 14px);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.72;
      }

      .controls {
        position: absolute;
        z-index: 4;
        right: clamp(18px, 2.4vw, 38px);
        bottom: clamp(18px, 2.4vw, 34px);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 9px;
        border-radius: 999px;
        background: rgba(25, 13, 8, 0.08);
        opacity: 0.34;
        transition: opacity 180ms ease;
      }

      .controls:hover,
      .controls:focus-within {
        opacity: 0.78;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        border: 0;
        background: rgba(255, 250, 240, 0.5);
        cursor: pointer;
        padding: 0;
      }

      .dot.active {
        width: 18px;
        background: rgba(255, 250, 240, 0.92);
      }

      .progress {
        position: absolute;
        z-index: 4;
        left: 0;
        right: 0;
        bottom: 0;
        height: 6px;
        background: rgba(255, 255, 255, 0.24);
      }

      .progress span {
        display: block;
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #fff4dc, var(--gold));
      }

      .slide.active ~ .progress span {
        animation: none;
      }

      @media (max-width: 900px) {
        body {
          overflow: auto;
        }

        .kiosk {
          min-height: 100vh;
          grid-template-rows: auto minmax(0, 1fr);
        }

        header {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
          min-height: auto;
        }

        .brand {
          min-width: 0;
        }

        nav {
          width: 100%;
          justify-content: flex-start;
          overflow-x: auto;
          flex-wrap: nowrap;
          padding-bottom: 4px;
        }

        nav a {
          min-height: 38px;
          padding: 0 14px;
        }

        .slide-copy {
          left: 26px;
          right: 26px;
          bottom: 100px;
          width: auto;
        }

        .slide-copy h2 {
          font-size: clamp(38px, 12vw, 64px);
        }

        .slide-copy p {
          font-size: 20px;
        }

        .controls {
          left: 20px;
          right: auto;
          bottom: 20px;
        }

        .carousel {
          height: 100%;
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="kiosk">
      <header>
        <div class="brand" aria-label="佛光山佛陀紀念館 智慧服務台">
          <div class="brand-mark" aria-hidden="true">佛</div>
          <h1 class="brand-title">
            佛光山佛陀紀念館
            <span class="brand-subtitle">智慧服務台</span>
          </h1>
        </div>
        <nav aria-label="主要選單">
          <a class="active" href="https://www.fgsbmc.org.tw/" target="_blank" rel="noreferrer">首頁</a>
          <a href="https://www.fgsbmc.org.tw/exhibition.aspx" target="_blank" rel="noreferrer">展覽</a>
          <a href="https://www.fgsbmc.org.tw/activity.aspx" target="_blank" rel="noreferrer">活動</a>
          <a href="https://www.fgsbmc.org.tw/traffic.aspx" target="_blank" rel="noreferrer">交通</a>
          <a href="https://www.fgsbmc.org.tw/contact.aspx" target="_blank" rel="noreferrer">服務</a>
        </nav>
      </header>

      <main>
        <section class="carousel" aria-label="智慧服務台輪播入口">
          <article class="slide active">
            <a class="slide-link" href="http://lnago.com/ADR1R" target="_blank" rel="noopener noreferrer" aria-label="前往童話劇《罐頭小人》">
              <img src="assets/banner-photo-1.jpg" alt="童話劇《罐頭小人》" />
            </a>
          </article>

          <article class="slide">
            <a class="slide-link" href="http://lnago.com/ADR1S" target="_blank" rel="noopener noreferrer" aria-label="前往為人間：遇見星雲大師">
              <img src="assets/banner-photo-2.jpg" alt="為人間：遇見星雲大師" />
            </a>
          </article>

          <article class="slide">
            <a class="slide-link" href="http://lnago.com/ADQ7R" target="_blank" rel="noopener noreferrer" aria-label="前往佛陀紀念館第18期徵才">
              <img src="assets/banner-photo-3.jpg" alt="佛陀紀念館第18期徵才" />
            </a>
          </article>

          <article class="slide">
            <a class="slide-link" href="http://lnago.com/ADR06" target="_blank" rel="noopener noreferrer" aria-label="前往人世間・迴響：南非天龍隊表演">
              <img src="assets/banner-photo-4.jpg" alt="人世間・迴響：南非天龍隊表演" />
            </a>
          </article>

          <article class="slide">
            <a class="slide-link" href="https://www.fgsbmc.org.tw/tw/exhibition.aspx?serno=189" target="_blank" rel="noopener noreferrer" aria-label="前往菩提心起：國立歷史博物館典藏佛像特展">
              <img src="assets/banner-photo-5.jpg" alt="菩提心起：國立歷史博物館典藏佛像特展" />
            </a>
          </article>

          <div class="controls" aria-label="輪播控制">
            <button class="dot active" type="button" aria-label="顯示第 1 張"></button>
            <button class="dot" type="button" aria-label="顯示第 2 張"></button>
            <button class="dot" type="button" aria-label="顯示第 3 張"></button>
            <button class="dot" type="button" aria-label="顯示第 4 張"></button>
            <button class="dot" type="button" aria-label="顯示第 5 張"></button>
          </div>
          <div class="progress" aria-hidden="true"><span></span></div>
        </section>
      </main>
    </div>

    <script>
      const slides = Array.from(document.querySelectorAll(".slide"));
      const dots = Array.from(document.querySelectorAll(".dot"));
      const progress = document.querySelector(".progress span");
      const intervalMs = 12000;
      let current = 0;
      let timer;

      function restartProgress() {
        progress.style.animation = "none";
        progress.offsetHeight;
        progress.style.animation = `fill ${intervalMs}ms linear forwards`;
      }

      function showSlide(index) {
        current = (index + slides.length) % slides.length;
        slides.forEach((slide, slideIndex) => {
          slide.classList.toggle("active", slideIndex === current);
        });
        dots.forEach((dot, dotIndex) => {
          dot.classList.toggle("active", dotIndex === current);
        });
        restartProgress();
      }

      function startTimer() {
        window.clearInterval(timer);
        timer = window.setInterval(() => showSlide(current + 1), intervalMs);
      }

      dots.forEach((dot, index) => {
        dot.addEventListener("click", () => {
          showSlide(index);
          startTimer();
        });
      });

      let touchStartX = 0;
      document.querySelector(".carousel").addEventListener("touchstart", (event) => {
        touchStartX = event.changedTouches[0].clientX;
      });
      document.querySelector(".carousel").addEventListener("touchend", (event) => {
        const delta = event.changedTouches[0].clientX - touchStartX;
        if (Math.abs(delta) > 60) {
          showSlide(current + (delta < 0 ? 1 : -1));
          startTimer();
        }
      });

      const style = document.createElement("style");
      style.textContent = `@keyframes fill { from { width: 0; } to { width: 100%; } }`;
      document.head.appendChild(style);
      restartProgress();
      startTimer();
    </script>
  </body>
</html>
