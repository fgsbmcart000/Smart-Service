<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>佛光山佛陀紀念館 智慧服務台</title>
    <meta
      name="description"
      content="佛光山佛陀紀念館智慧服務台平板入口首頁，提供輪播導覽與快速連結。"
    />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#5e291d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="智慧服務台" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/bodhi-leaf-favicon.svg"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <style>
      :root {
        --ink: #2b1d18;
        --muted: #75584b;
        --line: rgba(116, 58, 32, 0.18);
        --paper: #fff9ef;
        --brand: #823925;
        --brand-dark: #5e291d;
        --gold: #d9a958;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family:
          "Noto Sans TC",
          "PingFang TC",
          "Microsoft JhengHei",
          system-ui,
          sans-serif;
        overflow: hidden;
      }

      .kiosk {
        min-height: 100vh;
        min-height: 100svh;
        height: 100vh;
        height: 100svh;
        display: grid;
        grid-template-rows: 1fr;
      }

      header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 22px;
        min-height: 76px;
        padding: 14px clamp(22px, 4vw, 64px);
        color: #fffaf0;
        background: transparent;
        pointer-events: none;
      }

      .brand {
        display: flex;
        align-items: center;
        min-width: 192px;
      }

      .brand-logo {
        display: block;
        width: clamp(192px, 16vw, 240px);
        height: auto;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.85));
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      nav {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 14px;
        flex-wrap: wrap;
        pointer-events: auto;
      }

      nav a {
        min-height: 54px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        border: 1px solid rgba(247, 211, 144, 0.7);
        border-radius: 999px;
        color: #fff7e8;
        background: rgba(20, 26, 29, 0.42);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        text-decoration: none;
        font-size: clamp(16px, 1.2vw, 19px);
        font-weight: 700;
        white-space: nowrap;
        box-shadow: 0 0 0 1px rgba(255, 238, 189, 0.08) inset, 0 0 18px rgba(221, 172, 89, 0.2);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
        transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      nav a:focus-visible,
      .slide-link:focus-visible,
      .dot:focus-visible {
        outline: 4px solid rgba(217, 169, 88, 0.55);
        outline-offset: 4px;
      }

      nav a:hover {
        transform: translateY(-2px);
        background: linear-gradient(180deg, rgba(242, 202, 126, 0.38), rgba(193, 139, 66, 0.2));
        box-shadow: 0 0 24px rgba(236, 185, 96, 0.45);
      }

      nav button {
        min-height: 54px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 26px;
        border: 1px solid rgba(255, 230, 173, 0.9);
        border-radius: 999px;
        color: #2e2113;
        background: linear-gradient(180deg, #ffe8b1, #dca957);
        font: inherit;
        font-size: clamp(16px, 1.2vw, 19px);
        font-weight: 800;
        white-space: nowrap;
        cursor: pointer;
        box-shadow: 0 0 26px rgba(235, 184, 94, 0.55);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      nav button:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 0 34px rgba(255, 205, 113, 0.72);
      }

      nav button:focus-visible,
      .activity-close:focus-visible {
        outline: 4px solid rgba(255, 232, 177, 0.75);
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        nav a,
        nav button,
        .start-button,
        .quick-link,
        .activity-panel { transition: none; }
      }

      main {
        position: relative;
        min-height: 0;
        height: 100%;
      }

      .home-stage {
        display: block;
        padding: 0;
        color: #fff7e8;
        text-align: center;
        background:
          linear-gradient(180deg, rgba(8, 20, 35, 0.42) 0%, rgba(8, 17, 24, 0.1) 46%, rgba(7, 15, 18, 0.4) 100%),
          url("assets/museum-panorama.jpg") center center / cover no-repeat;
      }

      .home-background-link {
        position: absolute;
        inset: 0;
        z-index: 0;
        color: inherit;
        text-decoration: none;
      }

      .home-background-link:focus-visible {
        outline: 4px solid rgba(255, 225, 163, 0.96);
        outline-offset: -8px;
      }

      .home-copy {
        position: absolute;
        top: 42%;
        left: 50%;
        z-index: 1;
        width: min(1040px, 94vw);
        pointer-events: none;
        transform: translate(-50%, -64%);
        text-shadow: 0 4px 22px rgba(0, 0, 0, 0.72);
      }

      .home-kicker {
        margin: 0 0 12px;
        font-size: clamp(22px, 2.2vw, 34px);
        font-weight: 500;
        letter-spacing: 0.2em;
      }

      .home-title {
        margin: 0;
        font-size: clamp(48px, 7vw, 96px);
        line-height: 1.08;
        letter-spacing: 0.1em;
      }

      .home-english {
        display: block;
        margin-top: 8px;
        font-size: clamp(30px, 3.5vw, 52px);
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .translation-prompt {
        width: min(760px, 94vw);
        margin: 30px auto 0;
        padding: 28px 46px 30px;
        border: 1px solid rgba(255, 236, 199, 0.82);
        border-radius: 18px;
        color: #fff9ed;
        background: linear-gradient(180deg, rgba(9, 18, 24, 0.34), rgba(9, 18, 24, 0.54));
        -webkit-backdrop-filter: blur(7px);
        backdrop-filter: blur(7px);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28), 0 0 24px rgba(255, 220, 153, 0.13) inset;
      }

      .prompt-zh {
        display: block;
        font-size: clamp(30px, 3.3vw, 48px);
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .prompt-en {
        display: block;
        margin-top: 10px;
        font-size: clamp(30px, 3vw, 44px);
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .prompt-en.secondary {
        margin-top: 5px;
        color: #ffe1a3;
        font-size: clamp(26px, 2.4vw, 36px);
        font-weight: 500;
      }

      .start-button {
        position: absolute;
        left: 50%;
        bottom: clamp(176px, 22vh, 236px);
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-width: 230px;
        padding: 16px 34px;
        border: 1px solid rgba(255, 244, 218, 0.9);
        border-radius: 999px;
        color: #fffdf7;
        background: linear-gradient(135deg, rgba(205, 145, 54, 0.94), rgba(129, 57, 37, 0.96));
        box-shadow: 0 0 24px rgba(255, 206, 118, 0.58), 0 12px 30px rgba(0, 0, 0, 0.34);
        font-size: clamp(22px, 2.1vw, 32px);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-decoration: none;
        transform: translateX(-50%);
        transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
      }

      .start-button [lang="en"] {
        font-size: 1.08em;
        letter-spacing: 0.04em;
      }

      .start-button:hover,
      .start-button:focus-visible {
        filter: brightness(1.1);
        box-shadow: 0 0 34px rgba(255, 212, 132, 0.82), 0 14px 34px rgba(0, 0, 0, 0.4);
        transform: translateX(-50%) scale(1.04);
      }

      .quick-links {
        position: absolute;
        left: 50%;
        bottom: clamp(18px, 3vh, 34px);
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 14px;
        width: min(1240px, calc(100% - 72px));
        transform: translateX(-50%);
      }

      .quick-link {
        min-height: 108px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 10px;
        border: 1px solid rgba(255, 235, 191, 0.78);
        border-radius: 14px;
        color: #fffaf0;
        background: linear-gradient(155deg, rgba(35, 44, 46, 0.8), rgba(92, 55, 35, 0.72));
        -webkit-backdrop-filter: blur(9px);
        backdrop-filter: blur(9px);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3), 0 0 18px rgba(224, 172, 84, 0.18) inset;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
      }

      button.quick-link {
        font: inherit;
      }

      .quick-link:hover,
      .quick-link:focus-visible {
        border-color: #ffe0a3;
        background: linear-gradient(155deg, rgba(112, 72, 40, 0.9), rgba(57, 39, 31, 0.88));
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.36), 0 0 28px rgba(244, 190, 99, 0.38);
        outline: none;
        transform: translateY(-5px);
      }

      .quick-link-zh {
        display: block;
        font-size: clamp(22px, 1.55vw, 27px);
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .quick-link-en {
        display: block;
        color: #ffe0a3;
        font-size: clamp(18px, 1.25vw, 23px);
        font-weight: 650;
        line-height: 1.25;
      }

      .activity-panel {
        position: fixed;
        inset: 0;
        z-index: 20;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        background: #17130f;
        transition: opacity 240ms ease, visibility 240ms ease;
      }

      .activity-panel.open {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
      }

      .activity-close {
        position: absolute;
        top: 18px;
        right: 22px;
        z-index: 30;
        min-width: 52px;
        min-height: 52px;
        padding: 0 18px;
        border: 1px solid rgba(255, 244, 220, 0.72);
        border-radius: 999px;
        color: #fffaf0;
        background: rgba(17, 18, 20, 0.58);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 0 18px rgba(0, 0, 0, 0.3);
      }

      .carousel {
        position: relative;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        background: #17130f;
      }

      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform: scale(1.02);
        transition:
          opacity 900ms ease,
          transform 1200ms ease;
        pointer-events: none;
      }

      .slide.active {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }

      .slide-link {
        position: absolute;
        inset: 0;
        display: block;
        color: inherit;
        text-decoration: none;
        overflow: hidden;
        background-color: #17130f;
        background-position: top center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .slide img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
        z-index: 1;
      }

      .shade {
        position: absolute;
        inset: 0;
        z-index: 2;
        background:
          linear-gradient(90deg, rgba(35, 22, 16, 0.76), rgba(35, 22, 16, 0.18) 55%, rgba(35, 22, 16, 0.04)),
          linear-gradient(0deg, rgba(35, 22, 16, 0.44), transparent 45%);
      }

      .slide-copy {
        position: absolute;
        left: clamp(32px, 6vw, 92px);
        bottom: clamp(88px, 11vw, 128px);
        width: min(760px, 70vw);
        color: #fffaf0;
        z-index: 3;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 0 16px;
        border-radius: 999px;
        background: rgba(255, 246, 224, 0.18);
        border: 1px solid rgba(255, 246, 224, 0.32);
        font-size: clamp(15px, 1.4vw, 19px);
        font-weight: 700;
      }

      .slide-copy h2 {
        margin: 22px 0 14px;
        font-size: clamp(42px, 6vw, 84px);
        line-height: 1.05;
        font-weight: 900;
        letter-spacing: 0;
      }

      .slide-copy p {
        margin: 0;
        max-width: 620px;
        font-size: clamp(20px, 2.1vw, 30px);
        line-height: 1.45;
        font-weight: 500;
      }

      .cta {
        margin-top: 32px;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 62px;
        padding: 8px 30px 10px;
        border-radius: 999px;
        color: var(--brand-dark);
        background: #fff4dc;
        font-weight: 800;
        line-height: 1.12;
        box-shadow: 0 18px 42px rgba(41, 20, 12, 0.22);
      }

      .cta .zh {
        font-size: clamp(18px, 1.65vw, 23px);
      }

      .cta .en {
        margin-top: 3px;
        font-size: clamp(11px, 1vw, 14px);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.72;
      }

      .controls {
        position: absolute;
        z-index: 4;
        right: clamp(18px, 2.4vw, 38px);
        bottom: clamp(18px, 2.4vw, 34px);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 9px;
        border-radius: 999px;
        background: rgba(25, 13, 8, 0.08);
        opacity: 0.34;
        transition: opacity 180ms ease;
      }

      .controls:hover,
      .controls:focus-within {
        opacity: 0.78;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        border: 0;
        background: rgba(255, 250, 240, 0.5);
        cursor: pointer;
        padding: 0;
      }

      .dot.active {
        width: 18px;
        background: rgba(255, 250, 240, 0.92);
      }

      .progress {
        position: absolute;
        z-index: 4;
        left: 0;
        right: 0;
        bottom: 0;
        height: 6px;
        background: rgba(255, 255, 255, 0.24);
      }

      .progress span {
        display: block;
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #fff4dc, var(--gold));
      }

      .slide.active ~ .progress span {
        animation: none;
      }

      @media (max-width: 900px) {
        body {
          overflow: auto;
        }

        .kiosk {
          height: auto;
          min-height: 1250px;
          grid-template-rows: 1fr;
        }

        header {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
          min-height: auto;
        }

        .brand {
          min-width: 0;
        }

        nav {
          width: 100%;
          justify-content: flex-start;
          flex-wrap: wrap;
          padding-bottom: 4px;
        }

        nav a,
        nav button {
          min-height: 48px;
          padding: 0 18px;
        }

        .activity-close {
          top: 12px;
          right: 12px;
        }

        .home-stage {
          min-height: 1250px;
          background-position: 44% center;
        }

        .home-copy {
          top: 33%;
          transform: translate(-50%, -50%);
        }

        .translation-prompt {
          margin-top: 22px;
          padding: 22px 22px 24px;
        }

        .start-button {
          bottom: 380px;
        }

        .quick-links {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          width: min(580px, calc(100% - 44px));
        }

        .quick-link {
          min-height: 100px;
        }

        .slide-copy {
          left: 26px;
          right: 26px;
          bottom: 100px;
          width: auto;
        }

        .slide-copy h2 {
          font-size: clamp(38px, 12vw, 64px);
        }

        .slide-copy p {
          font-size: 20px;
        }

        .controls {
          left: 20px;
          right: auto;
          bottom: 20px;
        }

        .carousel {
          height: 100%;
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="kiosk">
      <header>
        <div class="brand">
          <img class="brand-logo" src="assets/buddha-museum-logo.png" alt="佛光山佛陀紀念館 Fo Guang Shan Buddha Museum" width="192" height="38" />
          <h1 class="sr-only">佛光山佛陀紀念館 智慧服務台</h1>
        </div>
      </header>

      <main class="home-stage">
        <a class="home-background-link" href="https://app.oratoflow.com/" target="_blank" rel="noopener noreferrer" aria-label="前往智慧服務台首頁"></a>
        <div class="home-copy">
          <p class="home-kicker">歡迎使用</p>
          <h2 class="home-title">智慧服務台<span class="home-english" lang="en">Smart service desk</span></h2>
          <div class="translation-prompt">
            <span class="prompt-zh">即時翻譯　請對我說話</span>
            <span class="prompt-en" lang="en">Please Speak to Me</span>
            <span class="prompt-en secondary" lang="en">Let me translate for you</span>
          </div>
        </div>
        <a class="start-button" href="https://app.oratoflow.com/" target="_blank" rel="noopener noreferrer">開始 <span lang="en">Start</span></a>
        <div class="quick-links" aria-label="快捷服務">
          <button class="quick-link" type="button" data-open-activities aria-haspopup="dialog" aria-controls="activity-panel">
            <span class="quick-link-zh">最新活動資訊</span>
            <span class="quick-link-en" lang="en">Latest Events</span>
          </button>
          <a class="quick-link" href="https://www.fgsbmc.org.tw/" target="_blank" rel="noopener noreferrer">
            <span class="quick-link-zh">佛陀紀念館 官方網站</span>
            <span class="quick-link-en" lang="en">Buddha Museum WEB</span>
          </a>
          <a class="quick-link" href="https://www.fgsbmc.org.tw/tw/visit-info.aspx" target="_blank" rel="noopener noreferrer">
            <span class="quick-link-zh">參觀須知</span>
            <span class="quick-link-en" lang="en">Notes for Visitors</span>
          </a>
          <a class="quick-link" href="https://www.fgsbmc.org.tw/tw/visit-route.aspx?s=7" target="_blank" rel="noopener noreferrer">
            <span class="quick-link-zh">用餐資訊</span>
            <span class="quick-link-en" lang="en">Food &amp; Restaurants</span>
          </a>
        </div>
      </main>

      <section id="activity-panel" class="activity-panel" role="dialog" aria-modal="true" aria-label="最新活動資訊" aria-hidden="true">
        <button id="activity-close" class="activity-close" type="button">關閉</button>
        <section class="carousel" aria-label="最新活動輪播">
          <article class="slide active">
            <a class="slide-link" href="http://lnago.com/ADR1R" target="_blank" rel="noopener noreferrer" aria-label="前往童話劇《罐頭小人》">
              <img src="assets/banner-photo-1.jpg" alt="童話劇《罐頭小人》" />
            </a>
          </article>

          <article class="slide">
            <a class="slide-link" href="http://lnago.com/ADR1S" target="_blank" rel="noopener noreferrer" aria-label="前往為人間：遇見星雲大師">
              <img src="assets/banner-photo-2.jpg" alt="為人間：遇見星雲大師" />
            </a>
          </article>

          <article class="slide">
            <a class="slide-link" href="http://lnago.com/ADQ7R" target="_blank" rel="noopener noreferrer" aria-label="前往佛陀紀念館第18期徵才">
              <img src="assets/banner-photo-3.jpg" alt="佛陀紀念館第18期徵才" />
            </a>
          </article>

          <article class="slide">
            <a class="slide-link" href="http://lnago.com/ADR06" target="_blank" rel="noopener noreferrer" aria-label="前往人世間・迴響：南非天龍隊表演">
              <img src="assets/banner-photo-4.jpg" alt="人世間・迴響：南非天龍隊表演" />
            </a>
          </article>

          <article class="slide">
            <a class="slide-link" href="https://www.fgsbmc.org.tw/tw/exhibition.aspx?serno=189" target="_blank" rel="noopener noreferrer" aria-label="前往菩提心起：國立歷史博物館典藏佛像特展">
              <img src="assets/banner-photo-5.jpg" alt="菩提心起：國立歷史博物館典藏佛像特展" />
            </a>
          </article>

          <div class="controls" aria-label="輪播控制">
            <button class="dot active" type="button" aria-label="顯示第 1 張"></button>
            <button class="dot" type="button" aria-label="顯示第 2 張"></button>
            <button class="dot" type="button" aria-label="顯示第 3 張"></button>
            <button class="dot" type="button" aria-label="顯示第 4 張"></button>
            <button class="dot" type="button" aria-label="顯示第 5 張"></button>
          </div>
          <div class="progress" aria-hidden="true"><span></span></div>
        </section>
      </section>
    </div>

    <script>
      const slides = Array.from(document.querySelectorAll(".slide"));
      const dots = Array.from(document.querySelectorAll(".dot"));
      const progress = document.querySelector(".progress span");
      const activityPanel = document.querySelector("#activity-panel");
      const activityTriggers = Array.from(document.querySelectorAll("[data-open-activities]"));
      const activityClose = document.querySelector("#activity-close");
      const intervalMs = 12000;
      let current = 0;
      let timer;
      let lastActivityTrigger = activityTriggers[0];

      function restartProgress() {
        progress.style.animation = "none";
        progress.offsetHeight;
        progress.style.animation = `fill ${intervalMs}ms linear forwards`;
      }

      function showSlide(index) {
        current = (index + slides.length) % slides.length;
        slides.forEach((slide, slideIndex) => {
          slide.classList.toggle("active", slideIndex === current);
        });
        dots.forEach((dot, dotIndex) => {
          dot.classList.toggle("active", dotIndex === current);
        });
        restartProgress();
      }

      function startTimer() {
        window.clearInterval(timer);
        timer = window.setInterval(() => showSlide(current + 1), intervalMs);
      }

      function openActivities(event) {
        lastActivityTrigger = event.currentTarget;
        activityPanel.classList.add("open");
        activityPanel.setAttribute("aria-hidden", "false");
        showSlide(current);
        startTimer();
        activityClose.focus();
      }

      function closeActivities() {
        activityPanel.classList.remove("open");
        activityPanel.setAttribute("aria-hidden", "true");
        window.clearInterval(timer);
        lastActivityTrigger?.focus();
      }

      activityTriggers.forEach((trigger) => trigger.addEventListener("click", openActivities));
      activityClose.addEventListener("click", closeActivities);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && activityPanel.classList.contains("open")) {
          closeActivities();
        }
      });

      dots.forEach((dot, index) => {
        dot.addEventListener("click", () => {
          showSlide(index);
          startTimer();
        });
      });

      let touchStartX = 0;
      document.querySelector(".carousel").addEventListener("touchstart", (event) => {
        touchStartX = event.changedTouches[0].clientX;
      });
      document.querySelector(".carousel").addEventListener("touchend", (event) => {
        const delta = event.changedTouches[0].clientX - touchStartX;
        if (Math.abs(delta) > 60) {
          showSlide(current + (delta < 0 ? 1 : -1));
          startTimer();
        }
      });

      const style = document.createElement("style");
      style.textContent = `@keyframes fill { from { width: 0; } to { width: 100%; } }`;
      document.head.appendChild(style);
    </script>
  </body>
</html>
